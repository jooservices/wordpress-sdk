name: CI post-merge

on:
  push:
    branches: [master, develop]

concurrency:
  group: ci-post-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Package gates
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and install
        run: |
          tools/ci/docker-compose build php
          tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist
      - name: Run package gates
        run: |
          tools/ci/docker-compose run --rm php composer validate --strict
          tools/ci/docker-compose run --rm php composer ci
          tools/test-clean-consumer

  integration:
    name: WordPress E2E
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run disposable WordPress integration suite
        run: tools/integration

name: CI

on:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHP image
        run: tools/ci/docker-compose build php
      - name: Cache Composer vendor
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: wordpress-sdk-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: wordpress-sdk-vendor-
      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist
      - name: Validate Composer metadata
        run: tools/ci/docker-compose run --rm php composer validate --strict

  lint:
    name: Lint (${{ matrix.name }})
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Pint
            command: composer lint:pint
          - name: PHPCS
            command: composer lint:phpcs
          - name: PHPStan
            command: composer lint:phpstan
          - name: PHPMD
            command: composer lint:phpmd
          - name: PHP-CS-Fixer
            command: composer lint:cs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHP image
        run: tools/ci/docker-compose build php
      - name: Cache Composer vendor
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: wordpress-sdk-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: wordpress-sdk-vendor-
      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist
      - name: Run linter
        run: tools/ci/docker-compose run --rm php ${{ matrix.command }}

  unit:
    name: Unit coverage
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHP image
        run: tools/ci/docker-compose build php
      - name: Cache Composer vendor
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: wordpress-sdk-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: wordpress-sdk-vendor-
      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist
      - name: Run unit tests and enforce coverage
        run: tools/ci/docker-compose run --rm php composer test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-Unit
          path: coverage.xml
          if-no-files-found: error

  consumer:
    name: Clean consumer
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHP image
        run: tools/ci/docker-compose build php
      - name: Verify clean consumer install
        run: tools/test-clean-consumer

  integration:
    name: WordPress E2E
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHP image
        run: tools/ci/docker-compose build php
      - name: Install dependencies
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist
      - name: Run disposable WordPress integration suite
        run: tools/integration

  security:
    name: Security (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        name: [Dependencies, Secrets, SAST]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build PHP image
        if: matrix.name == 'Dependencies'
        run: tools/ci/docker-compose build php
      - name: Audit locked Composer dependencies
        if: matrix.name == 'Dependencies'
        run: tools/ci/docker-compose run --rm php composer audit --locked
      - name: OSV Scanner
        if: matrix.name == 'Dependencies'
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            .
      - name: Review dependency changes
        if: matrix.name == 'Dependencies'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - name: Scan for secrets
        if: matrix.name == 'Secrets'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source . --redact --exit-code 1
      - name: Run PHP SAST
        if: matrix.name == 'SAST'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a \
            semgrep scan --config p/php --error

  coverage:
    name: Coverage upload
    needs: [unit, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-Unit
          path: .
      - name: Upload to Codecov
        if: github.event.pull_request.user.type != 'Bot'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
      - name: Resolve SonarQube host URL
        if: github.event.pull_request.user.type != 'Bot' && env.SONAR_TOKEN != ''
        id: sonar-config
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host_url="${host_url%/}"
          case "${host_url}" in
            http://*|https://*) ;;
            *) host_url="https://${host_url}" ;;
          esac
          if [[ ! "${host_url}" =~ ^https?://[^[:space:]/]+ ]]; then
            echo "SONAR_HOST_URL must be a valid HTTP(S) URL"
            exit 1
          fi
          echo "host_url=${host_url}" >> "${GITHUB_OUTPUT}"
      - name: Upload SonarQube analysis
        if: github.event.pull_request.user.type != 'Bot' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-config.outputs.host_url }}
        with:
          args: >
            -Dsonar.php.coverage.reportPaths=coverage.xml

name: CI

on:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHP image
        run: tools/ci/docker-compose build php
      - name: Cache Composer vendor
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: wordpress-sdk-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: wordpress-sdk-vendor-
      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist
      - name: Validate Composer metadata
        run: make validate

  lint:
    name: Lint (${{ matrix.name }})
    needs: [validate]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Pint
            command: composer lint:pint
          - name: PHPStan
            command: composer lint:phpstan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHP image
        run: tools/ci/docker-compose build php
      - name: Cache Composer vendor
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: wordpress-sdk-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: wordpress-sdk-vendor-
      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist
      - name: Run linter
        run: tools/ci/docker-compose run --rm php ${{ matrix.command }}

  unit:
    name: Unit coverage
    needs: [lint]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHP image
        run: tools/ci/docker-compose build php
      - name: Cache Composer vendor
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: wordpress-sdk-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: wordpress-sdk-vendor-
      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist
      - name: Run unit tests and enforce coverage
        run: make test-coverage

  consumer:
    name: Clean consumer
    needs: [lint]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHP image
        run: tools/ci/docker-compose build php
      - name: Verify clean consumer install
        run: make clean-consumer

  integration:
    name: WordPress E2E
    needs: [lint]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run disposable WordPress integration suite
        run: make integration

  security:
    name: Security (${{ matrix.name }})
    needs: [lint]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        name: [Dependencies, Secrets, SAST]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build PHP image
        if: matrix.name == 'Dependencies'
        run: tools/ci/docker-compose build php
      - name: Audit locked Composer dependencies
        if: matrix.name == 'Dependencies'
        run: make audit
      - name: Review dependency changes
        if: matrix.name == 'Dependencies'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - name: Scan for secrets
        if: matrix.name == 'Secrets'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source . --redact --exit-code 1
      - name: Run PHP SAST
        if: matrix.name == 'SAST'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a \
            semgrep scan --config p/php --error
